<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegful Garden</title>
<meta http-equiv="refresh" content="3;url=../">
<link rel="canonical" href="../">
</head>
<body style="font-family:system-ui,sans-serif;padding:24px;line-height:1.5">
<p>Vegful Garden moved to <a href="../">the main link</a>.</p>
<script>
(async()=>{try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.filter(r=>/\/garden\/$/.test(r.scope)).map(r=>r.unregister()))}catch(e){}location.replace('../'+location.search+location.hash)})();
</script>
</body>
</html>
